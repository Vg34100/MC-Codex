// Fixed mapped-symbol changes only. Lifecycle differences remain in canonical Java guards.
stonecutter.replacements.string(stonecutter.eval(stonecutter.current.version, '>=26.2')) {
    replace('net.minecraft.advancements.criterion.ItemPredicate', 'net.minecraft.advancements.predicates.ItemPredicate')
    replace('net.minecraft.advancements.CriteriaTriggers', 'net.minecraft.advancements.triggers.CriteriaTriggers')
    ['minecraft','mc','Minecraft.getInstance()'].each { receiver ->
        replace(receiver+'.screen', receiver+'.gui.screen()')
        replace(receiver+'.setScreen(', receiver+'.gui.setScreen(')
    }
    replace('mc.options.hideGui', 'mc.gui.hud.isHidden()')
    replace('@Mixin(Gui.class)', '@Mixin(net.minecraft.client.gui.Hud.class)')
}

stonecutter.replacements.string(stonecutter.eval(stonecutter.current.version, '>=26.3')) {
    replace('getConnection().getAdvancements().getTree()', 'getConnection().getAdvancements().tree()')
    replace('tree.getTree()', 'tree.tree()')
    ['display','currentDisplay','sourceDisplay','old','display().get()','display().orElseThrow()','display()'].each { receiver ->
        ['getTitle':'title','getDescription':'description','getIcon':'icon','getBackground':'background','getType':'type','shouldShowToast':'showToast','shouldAnnounceChat':'announceToChat','isHidden':'hidden'].each { before, after ->
            replace(receiver+'.'+before+'()',receiver+'.'+after+'()')
        }
    }
    replace('progress.serializeToNetwork(buf)', 'AdvancementProgress.STREAM_CODEC.encode(buf, progress)')
    replace('AdvancementProgress::fromNetwork', 'buf -> AdvancementProgress.STREAM_CODEC.decode(buf)')
    replace('requirements.write(buf)', 'AdvancementRequirements.STREAM_CODEC.encode(buf, requirements)')
    replace('AdvancementRequirements::new', 'buf -> AdvancementRequirements.STREAM_CODEC.decode(buf)')
    replace('packet.getRemoved()', 'packet.removed()')
    replace('packet.getProgress()', 'packet.progress()')
}

